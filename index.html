
        <!DOCTYPE html>
        <html lang="zh-CN">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>数据分析看板</title>
            <style>
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                }

                body {
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    min-height: 100vh;
                    padding: 20px;
                }

                .container {
                    max-width: 1400px;
                    margin: 0 auto;
                }

                .header {
                    background: white;
                    border-radius: 15px;
                    padding: 30px;
                    margin-bottom: 30px;
                    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                }

                .header h1 {
                    color: #333;
                    font-size: 2.5em;
                    margin-bottom: 10px;
                }

                .header .date {
                    color: #666;
                    font-size: 1.1em;
                }

                .grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
                    gap: 25px;
                    margin-bottom: 25px;
                }

                .section {
                    background: white;
                    border-radius: 15px;
                    padding: 25px;
                    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                    transition: transform 0.3s ease;
                }

                .section:hover {
                    transform: translateY(-5px);
                }

                .section-title {
                    display: flex;
                    align-items: center;
                    margin-bottom: 20px;
                    padding-bottom: 15px;
                    border-bottom: 2px solid #f0f0f0;
                }

                .section-title .icon {
                    font-size: 2em;
                    margin-right: 15px;
                }

                .section-title h2 {
                    color: #333;
                    font-size: 1.5em;
                    font-weight: 600;
                }

                /* 文本板块样式 */
                .text-content {
                    color: #555;
                    line-height: 1.8;
                    font-size: 1.1em;
                }

                /* 指标板块样式 */
                .metrics-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                    gap: 15px;
                }

                .metric-card {
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                    padding: 20px;
                    border-radius: 10px;
                    text-align: center;
                }

                .metric-value {
                    font-size: 2em;
                    font-weight: bold;
                    margin: 10px 0;
                }

                .metric-label {
                    font-size: 0.9em;
                    opacity: 0.9;
                }

                /* 表格样式 */
                table {
                    width: 100%;
                    border-collapse: collapse;
                }

                th {
                    background: #f8f9fa;
                    padding: 12px;
                    text-align: left;
                    font-weight: 600;
                    color: #333;
                }

                td {
                    padding: 12px;
                    border-bottom: 1px solid #f0f0f0;
                    color: #555;
                }

                tr:hover {
                    background: #f8f9fa;
                }

                /* 图表容器 */
                .chart-container {
                    height: 300px;
                    position: relative;
                }

                /* 简单的条形图 */
                .bar-chart {
                    display: flex;
                    align-items: flex-end;
                    height: 250px;
                    gap: 20px;
                    padding: 20px 0;
                }

                .bar-item {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                }

                .bar {
                    width: 100%;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    border-radius: 8px 8px 0 0;
                    transition: height 0.3s ease;
                    min-height: 4px;
                }

                .bar-label {
                    margin-top: 10px;
                    font-size: 0.9em;
                    color: #666;
                }

                @media (max-width: 768px) {
                    .grid {
                        grid-template-columns: 1fr;
                    }
                }
            </style>
        </head>
        <body>
            <div class="container">
                <div class="header">
                    <h1>数据分析看板</h1>
                    <div class="date">生成时间：2026-03-17 16:08:18</div>
                </div>

                <div class="grid">
                    
        <div class="section">
            <div class="section-title">
                <span class="icon">📄</span>
                <h2>项目概述</h2>
            </div>
            <div class="text-content">
                这是一个基于Python生成的数据可视化看板，展示了关键业务指标和数据洞察。
            </div>
        </div>
        

        <div class="section">
            <div class="section-title">
                <span class="icon">📈</span>
                <h2>关键指标</h2>
            </div>
            <div class="metrics-grid">
                
            <div class="metric-card">
                <div class="metric-label">总用户</div>
                <div class="metric-value">1,234</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">活跃用户</div>
                <div class="metric-value">892</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">转化率</div>
                <div class="metric-value">23.5%</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">总收入</div>
                <div class="metric-value">¥45,678</div>
            </div>
            
            </div>
        </div>
        

        <div class="section">
            <div class="section-title">
                <span class="icon">📊</span>
                <h2>周访问量统计</h2>
            </div>
            
            <div class="chart-container">
                <div class="bar-chart">
                    
                <div class="bar-item">
                    <div class="bar" style="height: 60.0%;"></div>
                    <div class="bar-label">周一: 120</div>
                </div>
                
                <div class="bar-item">
                    <div class="bar" style="height: 75.0%;"></div>
                    <div class="bar-label">周二: 150</div>
                </div>
                
                <div class="bar-item">
                    <div class="bar" style="height: 90.0%;"></div>
                    <div class="bar-label">周三: 180</div>
                </div>
                
                <div class="bar-item">
                    <div class="bar" style="height: 85.0%;"></div>
                    <div class="bar-label">周四: 170</div>
                </div>
                
                <div class="bar-item">
                    <div class="bar" style="height: 100.0%;"></div>
                    <div class="bar-label">周五: 200</div>
                </div>
                
                <div class="bar-item">
                    <div class="bar" style="height: 95.0%;"></div>
                    <div class="bar-label">周六: 190</div>
                </div>
                
                <div class="bar-item">
                    <div class="bar" style="height: 80.0%;"></div>
                    <div class="bar-label">周日: 160</div>
                </div>
                
                </div>
            </div>
            
        </div>
        

        <div class="section">
            <div class="section-title">
                <span class="icon">📋</span>
                <h2>产品销售数据</h2>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr><th>产品</th><th>销量</th><th>收入</th><th>库存</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>产品A</td><td>1200</td><td>24000</td><td>150</td></tr><tr><td>产品B</td><td>950</td><td>19000</td><td>80</td></tr><tr><td>产品C</td><td>2100</td><td>42000</td><td>200</td></tr><tr><td>产品D</td><td>850</td><td>17000</td><td>120</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
                </div>
            </div>

            <script>
                // 可以添加简单的交互
                console.log('Dashboard loaded');
            </script>
        </body>
        </html>
